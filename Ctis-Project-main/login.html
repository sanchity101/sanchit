<body class="h-full flex items-center justify-center font-body-md text-on-surface bg-background">
<div class="w-full max-w-md p-lg sm:p-2xl bg-surface-container-lowest rounded-xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1)] border border-outline-variant/30 flex flex-col items-center">
<!-- Logo -->
<div class="mb-lg">
<a href="index.html" title="Back to Home">
<img alt="CloudVault Logo" class="h-16 w-16 object-contain rounded-xl hover:scale-105 transition-transform" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApJWhsCLUiLH-Ao7dKyI4okBQgqqyXm4266SwkDPJiWlJWS_4NKr4pMOevEJVAmVy52K7v5zy5wyG4WhXfp88sHPlLdu3zfukJDCzl6YcQ5B4fsQtdVywZ6NZne0k-TzFIuABqLyZ3thCdvJP0DpFPfToTXy3s-Ql6BeWEltzR9bM35GiVtaihHpdOcGuYQKXrEpeAp_3QK1B56y3JUneT6OQgETdydvPO2CTISCVxmIUAELT6QSpt"/>
</a>
</div>
<!-- Heading -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm text-center">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl text-center">Sign in to securely access your files.</p>
<!-- Google Sign-In Button -->
<button type="button" id="google-login-btn" class="w-full flex items-center justify-center gap-sm py-md px-md border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface bg-surface hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20 mb-md">
<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
</svg>
<span>Sign in with Google</span>
</button>

<div class="relative flex py-1 items-center w-full mb-md">
<div class="flex-grow border-t border-outline-variant/40"></div>
<span class="flex-shrink mx-3 text-outline text-xs uppercase font-medium">or continue with email</span>
<div class="flex-grow border-t border-outline-variant/40"></div>
</div>

<!-- Form -->
<form class="w-full space-y-md" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</span>
<input class="block w-full pl-[40px] pr-sm py-sm rounded-lg bg-surface border border-outline-variant text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-shadow sm:text-body-md font-body-md" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</span>
<input class="block w-full pl-[40px] pr-sm py-sm rounded-lg bg-surface border border-outline-variant text-on-surface placeholder-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-shadow sm:text-body-md font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Error State Placeholder (Hidden by default) -->
<div class="hidden flex items-start p-sm bg-error-container text-on-error-container rounded-md border border-error/20" id="error-message">
<span aria-hidden="true" class="material-symbols-outlined mr-sm shrink-0" data-icon="error">error</span>
<p class="font-body-sm text-body-sm">Incorrect email or password. Please try again.</p>
</div>
<!-- Options -->
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-md px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                Login
            </button>
</form>
<!-- Footer Links -->
<p class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors" href="register.html">Create Account</a>
</p>
</div>
<script type="module">
        import {
            auth,
            googleProvider,
            signInWithPopup,
            signInWithEmailAndPassword,
            syncUserProfile
        } from "./firebase-config.js";

        const form = document.querySelector('form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const errorText = errorMsg.querySelector('p');
        const googleBtn = document.getElementById('google-login-btn');
        const submitBtn = form.querySelector('button[type="submit"]');

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        function hideError() {
            errorMsg.classList.add('hidden');
        }

        // Google Sign-In
        googleBtn.addEventListener('click', async () => {
            hideError();
            googleBtn.disabled = true;
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await syncUserProfile(result.user);
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Google sign-in error:", error);
                if (error.code === 'auth/unauthorized-domain') {
                    showError("Domain (localhost) is not in Firebase Authorized Domains. Add 'localhost' in Firebase Console > Authentication > Settings > Authorized domains.");
                } else if (error.code === 'auth/popup-closed-by-user') {
                    showError("Google Sign-In popup was closed before completing.");
                } else {
                    showError(error.message || "Failed to sign in with Google.");
                }
            } finally {
                googleBtn.disabled = false;
            }
        });

        // Email / Password Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
                await syncUserProfile(userCredential.user);
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Login error:", error);
                let friendlyMessage = "Incorrect email or password. Please try again.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    friendlyMessage = "Incorrect email or password. Please try again.";
                } else if (error.code === 'auth/too-many-requests') {
                    friendlyMessage = "Too many failed attempts. Please try again later.";
                } else if (error.code === 'auth/network-request-failed') {
                    friendlyMessage = "Network error. Please check your connection.";
                } else {
                    friendlyMessage = error.message;
                }
                showError(friendlyMessage);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Login";
            }
        });
    </script>
</body></html>
