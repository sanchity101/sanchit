<style>
        .shadow-ambient {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        }

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md sm:p-lg md:p-xl font-body-md antialiased">
<!-- Registration Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-ambient border border-outline-variant/30 overflow-hidden">
<!-- Header Section -->
<div class="px-xl pt-xl pb-lg flex flex-col items-center border-b border-surface-variant">
<!-- Logo -->
<div class="mb-lg">
<img alt="CloudVault Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApJWhsCLUiLH-Ao7dKyI4okBQgqqyXm4266SwkDPJiWlJWS_4NKr4pMOevEJVAmVy52K7v5zy5wyG4WhXfp88sHPlLdu3zfukJDCzl6YcQ5B4fsQtdVywZ6NZne0k-TzFIuABqLyZ3thCdvJP0DpFPfToTXy3s-Ql6BeWEltzR9bM35GiVtaihHpdOcGuYQKXrEpeAp_3QK1B56y3JUneT6OQgETdydvPO2CTISCVxmIUAELT6QSpt"/>
</div>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Join CloudVault</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Secure storage, effortless access.</p>
</div>
<!-- Form Section -->
<div class="p-xl">
<form id="register-form" class="space-y-gutter">
<!-- Full Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline px-sm pointer-events-none" data-icon="person">person</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-3xl pr-md py-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none input-glow transition-all duration-200" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline px-sm pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-3xl pr-md py-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none input-glow transition-all duration-200" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline px-sm pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-3xl pr-md py-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none input-glow transition-all duration-200" id="password" minlength="8" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline px-sm pointer-events-none" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg pl-3xl pr-md py-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none input-glow transition-all duration-200" id="confirmPassword" minlength="8" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Error State Placeholder -->
<div class="hidden flex items-start p-sm bg-error-container text-on-error-container rounded-md border border-error/20" id="error-message">
<span aria-hidden="true" class="material-symbols-outlined mr-sm shrink-0" data-icon="error">error</span>
<p class="font-body-sm text-body-sm"></p>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 flex items-center justify-center gap-sm" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>

<div class="w-full mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-sm">Or sign up with</span>
</div>
</div>
<div class="mt-md">
<button id="google-login-btn" class="w-full flex items-center justify-center gap-sm py-sm px-md border border-outline-variant rounded-lg shadow-sm font-label-md text-label-md text-on-surface bg-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="w-5 h-5">
<span>Sign up with Google</span>
</button>
</div>
</div>
</div>
<!-- Footer Section -->
<div class="px-xl pb-xl pt-lg bg-surface-container-low text-center rounded-b-xl border-t border-surface-variant">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container underline transition-colors duration-200" href="login.html">Login</a>
</p>
</div>
</main>
<script type="module" src="js/auth.js"></script>
</body></html>
